<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSS Worker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        p {
            color: #666;
            font-size: 1.1em;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .api-section {
            text-align: left;
            background: #f5f5f5;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
        }

        .api-section h2 {
            color: #333;
            font-size: 1.3em;
            margin-bottom: 15px;
        }

        .endpoint {
            background: white;
            padding: 12px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 0.95em;
        }

        .method {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 3px;
            margin-right: 10px;
            font-weight: bold;
            font-size: 0.85em;
        }

        .get {
            background: #4CAF50;
            color: white;
        }

        .post {
            background: #2196F3;
            color: white;
        }

        .delete {
            background: #f44336;
            color: white;
        }

        footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            color: #999;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔗 RSS Worker</h1>
        <p>A powerful Cloudflare Workers RSS feed aggregator and parser.</p>

        <div class="api-section">
            <h2>📡 API Endpoints</h2>
            <div class="endpoint">
                <span class="method get">GET</span>
                <span>/api/feeds</span>
            </div>
            <div class="endpoint">
                <span class="method post">POST</span>
                <span>/api/feeds</span>
            </div>
            <div class="endpoint">
                <span class="method get">GET</span>
                <span>/api/feeds/:feed_id/items</span>
            </div>
            <div class="endpoint">
                <span class="method delete">DELETE</span>
                <span>/api/feeds/:feed_id</span>
            </div>
            <div class="endpoint">
                <span class="method get">GET</span>
                <span>/health</span>
            </div>
        </div>

        <footer>
            <p>Built with Cloudflare Workers & Rust 🦀</p>
        </footer>
    </div>
</body>
</html>
